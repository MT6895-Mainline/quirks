# xaga (Redmi Note 11T Pro, MT6895 + MT6368 + 2x TFA9874)
#
# Each output owns a host stream, so PipeWire exposes independent sinks:
#   hw:,0  Playback_1 -> DL1 -> ADDA_DL -> MT6368 DAC   (3.5mm)
#   hw:,1  Capture_1  <- UL1  <- MTKAIF mic
#   hw:,2  Playback_2 -> DL2 -> I2S3 -> TFA9874 speakers
# Sequences only toggle their own taps; both outputs can run at once.
#
# NOTE: on xaga the codec's AIF data input sits on the AUD_DAT_MOSI2 pad,
# i.e. the ADDA_CH34 lanes, so Headphone enables CH3/CH4 (and CH1/2 for
# parity with downstream HAL).
#
# Mic input pin (PGA_L_Mux) is intentionally NOT set here: the xaga-mic-switch
# daemon selects AIN0 (built-in) vs AIN1 (headset, when a 4-pole headset with
# mic is plugged in) from the accdet SW_MICROPHONE_INSERT switch.

	SectionDevice."Speaker" {
		Comment "Speakers"

		Value {
			PlaybackPCM "hw:${CardId},2"
			PlaybackChannels 2
		}

		EnableSequence [
			cset "name='I2S3_CH1 DL2_CH1' 1"
			cset "name='I2S3_CH2 DL2_CH2' 1"
		]

		DisableSequence [
			cset "name='I2S3_CH1 DL2_CH1' 0"
			cset "name='I2S3_CH2 DL2_CH2' 0"
		]
	}

	SectionDevice."Headphone" {
		Comment "3.5mm Headphones"

		Value {
			PlaybackPCM "hw:${CardId},0"
			PlaybackChannels 2
			JackControl "Headset Jack"
		}

		EnableSequence [
			cset "name='RCV Mux' 'Open'"
			cset "name='HPL Mux' 'Audio Playback'"
			cset "name='HPR Mux' 'Audio Playback'"
			cset "name='Headset Volume' 20,20"
			cset "name='ADDA_DL_CH1 DL1_CH1' 1"
			cset "name='ADDA_DL_CH2 DL1_CH2' 1"
			cset "name='ADDA_DL_CH3 DL1_CH1' 1"
			cset "name='ADDA_DL_CH4 DL1_CH2' 1"
		]

		DisableSequence [
			cset "name='ADDA_DL_CH1 DL1_CH1' 0"
			cset "name='ADDA_DL_CH2 DL1_CH2' 0"
			cset "name='ADDA_DL_CH3 DL1_CH1' 0"
			cset "name='ADDA_DL_CH4 DL1_CH2' 0"
		]
	}

	SectionDevice."Mic" {
		Comment "Built-in Microphone"

		Value {
			CapturePCM "hw:${CardId},1"
			CaptureChannels 2
		}

		EnableSequence [
			# MT6368 input muxes power the whole capture DAPM path (UL SRC,
			# MTKAIF pin mux, codec TX); register reset defaults leave them
			# disconnected. Values match the Android twin's recording state.
			# PGA_L_Mux is owned by the xaga-mic-switch daemon (AIN0/AIN1).
			cset "name='MISO0_MUX' 'UL1_CH1'"
			cset "name='MISO1_MUX' 'UL1_CH1'"
			cset "name='ADC_L_Mux' 'Left Preamplifier'"
			cset "name='PGA1 Volume' 3"
			cset "name='UL1_CH1 ADDA_UL_CH1' 1"
			cset "name='UL1_CH2 ADDA_UL_CH1' 1"
			cset "name='UL1_CH3 ADDA_UL_CH3' 1"
			cset "name='UL1_CH4 ADDA_UL_CH4' 1"
		]

		DisableSequence [
			cset "name='UL1_CH1 ADDA_UL_CH1' 0"
			cset "name='UL1_CH2 ADDA_UL_CH1' 0"
		]
	}
